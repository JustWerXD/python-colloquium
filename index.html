  <title>Колоквиум по Python</title>
  <style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c2330;
  --muted: #5d6778;
  --border: #dde1e8;
  --accent: #2f5fd0;
  --accent-text: #ffffff;
  --ok: #1f8a4c;
  --ok-bg: #e4f5ea;
  --bad: #c0392b;
  --bad-bg: #fbe9e6;
  --why-bg: #eef3fd;
  --warn-bg: #fbf1dc;
  --simple: #1f8a4c;
  --medium: #b7791f;
  --hard: #c0392b;
  --claude: #6b46c1;
  --claude-bg: #efe9fb;
  --file: #2f5fd0;
  --file-bg: #e6edfb;
  --code-bg: #f1f3f7;
  --code-text: #1c2330;
  --tok-kw: #a626a4;
  --tok-str: #2e7d32;
  --tok-com: #7b8494;
  --tok-num: #b45309;
  --tok-dec: #0b7285;
  --tok-const: #c2410c;
  --tok-builtin: #1d4ed8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b;
    --surface: #1b2029;
    --text: #e6e9ef;
    --muted: #9aa4b5;
    --border: #2d3441;
    --accent: #6f95ff;
    --accent-text: #0c1020;
    --ok: #55c785;
    --ok-bg: #16301f;
    --bad: #f08577;
    --bad-bg: #3a1c18;
    --why-bg: #1b2538;
    --warn-bg: #3a2f17;
    --simple: #55c785;
    --medium: #e3b25a;
    --hard: #f08577;
    --claude: #b49cf2;
    --claude-bg: #2a2142;
    --file: #8fb0ff;
    --file-bg: #1b2745;
    --code-bg: #12161d;
    --code-text: #e6e9ef;
    --tok-kw: #d98cf0;
    --tok-str: #8fd18f;
    --tok-com: #7b8494;
    --tok-num: #f0b36a;
    --tok-dec: #6fd0e6;
    --tok-const: #f59e6b;
    --tok-builtin: #8fb0ff;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.top-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-top: 10px; padding-bottom: 10px; }
.top h1 { font-size: 1.1rem; margin: 0; }
.tabs { display: flex; gap: 6px; }
.tab { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: .92rem; cursor: pointer; }
.tab[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

main { padding-top: 20px; padding-bottom: 60px; }

h2 { font-size: 1.35rem; margin: 0 0 6px; }
h3 { font-size: 1.05rem; margin: 22px 0 8px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }

/* кнопки */
.btn { font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 11px 18px; border-radius: 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.btn.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn-row .grow { flex: 1 1 160px; }
kbd { font: .78em ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--code-bg); color: var(--muted); }

/* бейджи */
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.badge { font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.badge.simple { color: var(--simple); border-color: var(--simple); }
.badge.medium { color: var(--medium); border-color: var(--medium); }
.badge.hard { color: var(--hard); border-color: var(--hard); }
.badge.repeat { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.badge.claude { color: var(--claude); background: var(--claude-bg); border-color: transparent; }
.badge.file { color: var(--file); background: var(--file-bg); border-color: transparent; }

/* форма настроек */
.field-group { margin: 12px 0; }
.field-group legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; }
.check { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; cursor: pointer; }
.check input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--accent); }
.check .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.cols { columns: 1; }
@media (min-width: 640px) { .cols { columns: 2; column-gap: 24px; } .cols .check { break-inside: avoid; } }

/* прогресс */
.progress-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
.bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; }
.status { min-height: 1.5em; font-size: .9rem; margin: 0 0 8px; color: var(--muted); }
.status.bad { color: var(--bad); }
.status.ok { color: var(--ok); }

/* вопрос */
.question { font-size: 1.2rem; font-weight: 600; margin: 0 0 12px; }
.answer-block { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }
.answer-block + .answer-block { margin-top: 14px; }
.answer-block.why { border-top: 0; border-left: 4px solid var(--accent); background: var(--why-bg); border-radius: 0 10px 10px 0; padding: 12px 14px; }
.badge.why { color: var(--accent); background: var(--why-bg); border-color: var(--accent); }
.rich p { margin: 0 0 .7em; }
.rich ul { margin: 0 0 .7em; padding-left: 1.3em; }
.rich > :last-child { margin-bottom: 0; }
.rich code, .question code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--code-bg); color: var(--code-text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 .8em; overflow-x: auto; }
pre code { background: none; padding: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .86rem; line-height: 1.5; white-space: pre; }
.tok-kw { color: var(--tok-kw); }
.tok-str { color: var(--tok-str); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-num { color: var(--tok-num); }
.tok-dec { color: var(--tok-dec); }
.tok-const { color: var(--tok-const); }
.tok-builtin { color: var(--tok-builtin); }

/* итоги */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--code-bg); border-radius: 10px; padding: 10px 14px; }
.stat b { display: block; font-size: 1.6rem; line-height: 1.2; }
.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: 6px 0; border-bottom: 1px solid var(--border); }

/* просмотр всех вопросов */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar input[type="search"] { flex: 1 1 220px; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
details.q { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
details.q > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style-position: inside; }
details.q[open] > summary { border-bottom: 1px solid var(--border); }
details.q .inner { padding: 12px 14px 14px; }
.topic-title { margin: 26px 0 8px; font-size: 1.1rem; }
.hidden { display: none !important; }

/* быстрая проверка */
.btn.half { background: var(--warn-bg); border-color: var(--medium); color: var(--medium); }
.indent { margin-left: 26px; }
.timer { font-variant-numeric: tabular-nums; font-size: 1.1rem; color: var(--text); }
.timer.low { color: var(--bad); }
.split li { display: flex; justify-content: space-between; gap: 12px; }
.res { display: inline-block; min-width: 1.6em; text-align: center; font-weight: 700; margin-right: 6px; }
.res.ok { color: var(--ok); }
.res.half { color: var(--medium); }
.res.bad { color: var(--bad); }

</style>
</head>

  "code": "",

  "claude": "**Область видимости (scope)** — участок кода, где имя доступно. Правило **LEGB** — порядок поиска имени:\n1. **L**ocal — внутри текущей функции;\n2. **E**nclosing — в охватывающих функциях;\n3. **G**lobal — в модуле;\n4. **B**uilt-in — встроенные имена.\n\nБерётся первое найденное. Если не найдено нигде — `NameError`.\n\n```python\nx = \"global\"\ndef outer():\n    x = \"enclosing\"\n    def inner():\n        x = \"local\"\n        print(x)      # local\n    inner()\n    print(x)          # enclosing\nouter()\nprint(x)              # global\n```",

  <script>
"use strict";

/* ---------- данные ---------- */

const QUESTIONS = window.QUESTIONS || [];
const BY_ID = new Map(QUESTIONS.map((q) => [q.id, q]));

const LEVEL_NAMES = { simple: "Простой", medium: "Средний", hard: "Сложный" };
const LEVEL_POINTS = { simple: "0.5 балла", medium: "1 балл", hard: "2 балла" };
const LEVEL_ORDER = ["simple", "medium", "hard"];

const TOPICS = [];
for (const q of QUESTIONS) {
  if (!TOPICS.some((t) => t.no === q.topic_no)) {
    TOPICS.push({ no: q.topic_no, name: q.topic.replace(/\.\s*$/, "") });
  }
}

/* ---------- хранилище (localStorage может быть недоступен) ---------- */

const KEY_SESSION = "colloq.session.v1";
const KEY_WEAK = "colloq.weak.v1";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* без сохранения сайт всё равно работает */
  }
}

/* ---------- вспомогательное ---------- */

const $app = document.getElementById("app");

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function plural(n, one, few, many) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- подсветка Python-кода ---------- */

const PY_KEYWORDS = new Set(
  ("and as assert async await break case class continue def del elif else except finally for from " +
    "global if import in is lambda match nonlocal not or pass raise return try while with yield").split(" ")
);
const PY_CONSTS = new Set(["True", "False", "None", "self", "cls"]);
const PY_BUILTINS = new Set(
  ("print input int float str bool list dict set tuple frozenset len range iter next hash id isinstance " +
    "type super object enumerate zip map filter sorted sum min max abs open Exception ValueError TypeError " +
    "StopIteration GeneratorExit ZeroDivisionError").split(" ")
);
const PY_RE =
  /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rfbRFB]{0,2}"(?:\\.|[^"\\\n])*"|[rfbRFB]{0,2}'(?:\\.|[^'\\\n])*')|(@[A-Za-z_][\w.]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;

function highlightPython(code) {
  let out = "";
  let last = 0;
  code.replace(PY_RE, (m, com, str, dec, num, ident, offset) => {
    out += esc(code.slice(last, offset));
    last = offset + m.length;
    let cls = "";
    if (com) cls = "tok-com";
    else if (str) cls = "tok-str";
    else if (dec) cls = "tok-dec";
    else if (num) cls = "tok-num";
    else if (PY_KEYWORDS.has(ident)) cls = "tok-kw";
    else if (PY_CONSTS.has(ident)) cls = "tok-const";
    else if (PY_BUILTINS.has(ident)) cls = "tok-builtin";
    out += cls ? `<span class="${cls}">${esc(m)}</span>` : esc(m);
    return m;
  });
  out += esc(code.slice(last));
  return out;
}

function codeBlock(code) {
  return `<pre><code>${highlightPython(code)}</code></pre>`;
}

/* ---------- мини-разметка для ответов ---------- */

function inline(text, allowBold = true) {
  // 1) прячем `код`, чтобы звёздочки внутри него (`**kwargs`) не считались разметкой
  const codes = [];
  const hidden = text.replace(/`([^`]+)`/g, (m, code) => {
    codes.push(`<code>${esc(code)}</code>`);
    return `\u0001${codes.length - 1}\u0001`;
  });
  // 2) экранируем и делаем **жирный**
  let html = esc(hidden);
  if (allowBold) html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  // 3) возвращаем код на место
  return html.replace(/\u0001(\d+)\u0001/g, (m, i) => codes[Number(i)]);
}

function textBlocks(text) {
  const lines = text.split("\n");
  let html = "";
  let para = [];
  let list = [];
  const flushPara = () => {
    if (para.length) html += `<p>${para.map((line) => inline(line)).join("<br>")}</p>`;
    para = [];
  };
  const flushList = () => {
    if (list.length) html += `<ul>${list.map((li) => `<li>${inline(li)}</li>`).join("")}</ul>`;
    list = [];
  };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) {
      flushPara();
      flushList();
    } else if (/^\s*[-•]\s+/.test(line)) {
      flushPara();
      list.push(line.replace(/^\s*[-•]\s+/, ""));
    } else {
      flushList();
      para.push(line.trim());
    }
  }
  flushPara();
  flushList();
  return html;
}

function rich(text) {
  let html = "";
  let last = 0;
  const re = /```[\w+-]*\n([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text))) {
    html += textBlocks(text.slice(last, m.index));
    html += codeBlock(m[1].replace(/\n$/, ""));
    last = m.index + m[0].length;
  }
  html += textBlocks(text.slice(last));
  return `<div class="rich">${html}</div>`;
}

/* ---------- общие куски разметки ---------- */

function badges(q, extra = "") {
  return (
    `<div class="badges">` +
    `<span class="badge">${esc(topicName(q))}</span>` +
    `<span class="badge ${q.level}">${LEVEL_NAMES[q.level]} · ${LEVEL_POINTS[q.level]}</span>` +
    extra +
    `</div>`
  );
}

function topicName(q) {
  return q.topic.replace(/\.\s*$/, "");
}

function questionBody(q) {
  return `<p class="question">${inlineQuestion(q.question)}</p>` + (q.code ? codeBlock(q.code) : "");
}

// в тексте вопросов звёздочки (**kwargs) — это просто текст, не жирный шрифт
function inlineQuestion(text) {
  return inline(text, false);
}

function answerBlocks(q) {
  let html = "";
  if (q.answer) {
    html +=
      `<div class="answer-block"><div class="badges"><span class="badge file">ответ из файла колоквиума</span></div>` +
      rich(q.answer) +
      `</div>`;
  }
  if (q.claude) {
    const label = q.answer ? "дополнение от Claude" : "ответ от Claude";
    html +=
      `<div class="answer-block"><div class="badges"><span class="badge claude">${label}</span></div>` +
      rich(q.claude) +
      `</div>`;
  }
  if (q.why) {
    html +=
      `<div class="answer-block why"><div class="badges"><span class="badge why">почему так</span></div>` +
      rich(q.why) +
      `</div>`;
  }
  return html;
}

/* ---------- навигация ---------- */

let currentTab = "learn";
let learnView = "home"; // home | play | done
let session = null;
let revealed = false;
let statusMsg = { text: "", kind: "" };

function markTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((b) => {
    b.setAttribute("aria-current", b.dataset.tab === tab ? "true" : "false");
  });
}

function setTab(tab) {
  // уйти с вкладки «Проверка» посреди теста = прервать его (таймер не должен идти в фоне)
  if (currentTab === "quiz" && tab !== "quiz") abortQuiz();
  markTab(tab);
  render();
}

document.querySelectorAll(".tab").forEach((b) => {
  b.addEventListener("click", () => setTab(b.dataset.tab));
});

function render() {
  if (currentTab === "browse") return renderBrowse();
  if (currentTab === "quiz") return renderQuiz();
  if (learnView === "play" && session) return renderPlay();
  if (learnView === "done" && session) return renderDone();
  learnView = "home";
  return renderHome();
}

/* ---------- заучивание: стартовый экран ---------- */

function renderHome() {
  const saved = loadJSON(KEY_SESSION, null);
  const weak = loadJSON(KEY_WEAK, {});
  const weakCount = Object.keys(weak).filter((id) => BY_ID.has(Number(id))).length;
  const hasSaved = saved && Array.isArray(saved.queue) && saved.queue.length > 0;

  const topicBoxes = TOPICS.map((t) => {
    const n = QUESTIONS.filter((q) => q.topic_no === t.no).length;
    return `<label class="check"><input type="checkbox" name="topic" value="${t.no}" checked>
      <span>${esc(t.name)} <span class="count">(${n})</span></span></label>`;
  }).join("");

  const levelBoxes = LEVEL_ORDER.map((l) => {
    const n = QUESTIONS.filter((q) => q.level === l).length;
    return `<label class="check"><input type="checkbox" name="level" value="${l}" checked>
      <span>${LEVEL_NAMES[l]} <span class="count">(${n})</span></span></label>`;
  }).join("");

  $app.innerHTML = `
    <h2>Режим заучивания</h2>
    <p class="muted">Вопросы идут в случайном порядке, каждый задаётся хотя бы раз.
    Нажали «Не знаю» — вопрос вернётся в конец очереди и будет повторяться, пока вы его не вспомните.</p>

    ${
      hasSaved
        ? `<div class="card">
        <b>Есть незаконченная сессия</b>
        <p class="muted small" style="margin:4px 0 0">Выучено ${saved.known.length} из ${saved.total}, в очереди ещё ${saved.queue.length}.</p>
        <div class="btn-row"><button class="btn primary" id="resume" type="button">Продолжить</button></div>
      </div>`
        : ""
    }

    <form class="card" id="setup">
      <b>Что учить</b>
      <fieldset class="field-group"><legend class="small muted">Темы</legend>
        <div class="cols">${topicBoxes}</div>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn ghost small" type="button" id="all-topics">Все темы</button>
          <button class="btn ghost small" type="button" id="no-topics">Снять все</button>
        </div>
      </fieldset>
      <fieldset class="field-group"><legend class="small muted">Сложность</legend>
        <div>${levelBoxes}</div>
      </fieldset>
      <label class="check">
        <input type="checkbox" id="only-weak" ${weakCount ? "" : "disabled"}>
        <span>Только проблемные вопросы, где я ошибался раньше <span class="count">(${weakCount})</span></span>
      </label>
      <p class="muted small" id="count-line"></p>
      <div class="btn-row"><button class="btn primary grow" id="start" type="submit">Начать заучивание</button></div>
    </form>
  `;

  const form = document.getElementById("setup");
  const updateCount = () => {
    const ids = pickIds(form);
    document.getElementById("count-line").textContent = `Будет вопросов: ${ids.length}`;
    document.getElementById("start").disabled = ids.length === 0;
  };
  form.addEventListener("change", updateCount);
  document.getElementById("all-topics").addEventListener("click", () => {
    form.querySelectorAll('input[name="topic"]').forEach((c) => (c.checked = true));
    updateCount();
  });
  document.getElementById("no-topics").addEventListener("click", () => {
    form.querySelectorAll('input[name="topic"]').forEach((c) => (c.checked = false));
    updateCount();
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    startSession(pickIds(form));
  });
  const resume = document.getElementById("resume");
  if (resume) {
    resume.addEventListener("click", () => {
      session = saved;
      session.mistakes = session.mistakes || {};
      revealed = false;
      statusMsg = { text: "", kind: "" };
      learnView = "play";
      render();
    });
  }
  updateCount();
}

function pickIds(form) {
  const topics = new Set([...form.querySelectorAll('input[name="topic"]:checked')].map((c) => Number(c.value)));
  const levels = new Set([...form.querySelectorAll('input[name="level"]:checked')].map((c) => c.value));
  const onlyWeak = form.querySelector("#only-weak").checked;
  const weak = loadJSON(KEY_WEAK, {});
  return QUESTIONS.filter(
    (q) => topics.has(q.topic_no) && levels.has(q.level) && (!onlyWeak || weak[q.id])
  ).map((q) => q.id);
}

/* ---------- заучивание: сессия ---------- */

function startSession(ids) {
  session = {
    queue: shuffle(ids),
    total: ids.length,
    known: [],
    mistakes: {}, // id -> сколько раз ошиблись в этой сессии
    wrongTotal: 0,
  };
  saveJSON(KEY_SESSION, session);
  revealed = false;
  statusMsg = { text: "", kind: "" };
  learnView = "play";
  render();
}

function renderPlay() {
  if (session.queue.length === 0) return finishSession();

  const q = BY_ID.get(session.queue[0]);
  const done = session.known.length;
  const left = session.queue.length;
  const mistakes = session.mistakes[q.id] || 0;
  const repeatBadge = mistakes
    ? `<span class="badge repeat">повтор · ошибок: ${mistakes}</span>`
    : "";

  $app.innerHTML = `
    <div class="progress-line">
      <span>Выучено <b>${done}</b> из ${session.total}</span>
      <span>В очереди: ${left} · ошибок: ${session.wrongTotal}</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${session.total}" aria-valuenow="${done}">
      <span style="width:${session.total ? (done / session.total) * 100 : 0}%"></span>
    </div>
    <p class="status ${statusMsg.kind}" aria-live="polite">${esc(statusMsg.text)}</p>

    <div class="card">
      ${badges(q, repeatBadge)}
      ${questionBody(q)}
      ${
        revealed
          ? answerBlocks(q) +
            `<div class="btn-row">
              <button class="btn bad grow" id="dont-know" type="button">Не знаю <kbd>1</kbd></button>
              <button class="btn ok grow" id="know" type="button">Знаю <kbd>2</kbd></button>
            </div>`
          : `<div class="btn-row"><button class="btn primary grow" id="reveal" type="button">Показать ответ <kbd>Пробел</kbd></button></div>`
      }
    </div>
    <div class="btn-row"><button class="btn ghost" id="exit" type="button">Выйти (прогресс сохранится)</button></div>
  `;

  if (revealed) {
    document.getElementById("know").addEventListener("click", () => answer(true));
    document.getElementById("dont-know").addEventListener("click", () => answer(false));
  } else {
    document.getElementById("reveal").addEventListener("click", reveal);
  }
  document.getElementById("exit").addEventListener("click", () => {
    learnView = "home";
    render();
  });
  window.scrollTo({ top: 0 });
}

function reveal() {
  revealed = true;
  render();
}

function answer(knew) {
  const id = session.queue.shift();
  const weak = loadJSON(KEY_WEAK, {});
  if (knew) {
    session.known.push(id);
    if (!session.mistakes[id]) delete weak[id];
    statusMsg = { text: "Отлично, вопрос выучен.", kind: "ok" };
  } else {
    session.mistakes[id] = (session.mistakes[id] || 0) + 1;
    session.wrongTotal += 1;
    session.queue.push(id);
    weak[id] = 1;
    statusMsg = { text: "Вопрос вернётся в конец очереди.", kind: "bad" };
  }
  saveJSON(KEY_WEAK, weak);
  saveJSON(KEY_SESSION, session);
  revealed = false;
  render();
}

function finishSession() {
  saveJSON(KEY_SESSION, null);
  learnView = "done";
  render();
}

function renderDone() {
  const hadMistakes = Object.keys(session.mistakes).map(Number);
  const firstTry = session.total - hadMistakes.length;
  const list = hadMistakes
    .map((id) => BY_ID.get(id))
    .sort((a, b) => session.mistakes[b.id] - session.mistakes[a.id])
    .map(
      (q) =>
        `<li>${inlineQuestion(q.question)} <span class="muted small">— ${esc(topicName(q))}, ошибок: ${session.mistakes[q.id]}</span></li>`
    )
    .join("");

  $app.innerHTML = `
    <h2>Сессия закончена 🎉</h2>
    <p class="muted">Все вопросы пройдены, и каждый вы в итоге вспомнили.</p>
    <div class="stat-grid">
      <div class="stat"><b>${session.total}</b>вопросов в сессии</div>
      <div class="stat"><b>${firstTry}</b>с первого раза</div>
      <div class="stat"><b>${session.wrongTotal}</b>${plural(session.wrongTotal, "ошибка", "ошибки", "ошибок")} всего</div>
    </div>
    ${
      hadMistakes.length
        ? `<div class="card"><b>Где были ошибки</b><ul class="list-plain" style="margin-top:8px">${list}</ul></div>`
        : ""
    }
    <div class="btn-row">
      ${
        hadMistakes.length
          ? `<button class="btn primary" id="again-wrong" type="button">Повторить только трудные (${hadMistakes.length})</button>`
          : ""
      }
      <button class="btn" id="again-all" type="button">Заново те же вопросы</button>
      <button class="btn ghost" id="home" type="button">В начало</button>
    </div>
  `;
  const allIds = [...session.known];
  if (hadMistakes.length) {
    document.getElementById("again-wrong").addEventListener("click", () => startSession(hadMistakes));
  }
  document.getElementById("again-all").addEventListener("click", () => startSession(allIds));
  document.getElementById("home").addEventListener("click", () => {
    learnView = "home";
    render();
  });
}

/* ---------- все вопросы (чтение) ---------- */

const browseState = { text: "", levels: new Set(LEVEL_ORDER) };

function renderBrowse() {
  const chips = LEVEL_ORDER.map(
    (l) =>
      `<button class="chip" type="button" data-level="${l}" aria-pressed="${browseState.levels.has(l)}">${LEVEL_NAMES[l]}</button>`
  ).join("");

  $app.innerHTML = `
    <h2>Все вопросы</h2>
    <p class="muted">Нажмите на вопрос, чтобы увидеть ответ.</p>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Поиск по вопросам и ответам" value="${esc(browseState.text)}" aria-label="Поиск">
      <div class="chips">${chips}</div>
    </div>
    <p class="muted small" id="found"></p>
    <div id="list"></div>
  `;

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    browseState.text = search.value;
    renderList();
  });
  document.querySelectorAll(".chip").forEach((c) => {
    c.addEventListener("click", () => {
      const l = c.dataset.level;
      if (browseState.levels.has(l)) browseState.levels.delete(l);
      else browseState.levels.add(l);
      c.setAttribute("aria-pressed", browseState.levels.has(l));
      renderList();
    });
  });
  renderList();
}

function renderList() {
  const needle = browseState.text.trim().toLowerCase();
  const items = QUESTIONS.filter((q) => {
    if (!browseState.levels.has(q.level)) return false;
    if (!needle) return true;
    return (q.question + " " + q.code + " " + q.answer + " " + q.claude + " " + q.why).toLowerCase().includes(needle);
  });
  document.getElementById("found").textContent = `Найдено: ${items.length} из ${QUESTIONS.length}`;

  let html = "";
  let lastTopic = null;
  for (const q of items) {
    if (q.topic_no !== lastTopic) {
      html += `<h3 class="topic-title">${esc(topicName(q))}</h3>`;
      lastTopic = q.topic_no;
    }
    const origin = q.answer ? (q.claude ? "" : " · из файла") : " · ответ от Claude";
    html += `<details class="q"><summary>${inlineQuestion(q.question)}
      <span class="muted small">(${LEVEL_NAMES[q.level].toLowerCase()}${origin})</span></summary>
      <div class="inner">${q.code ? codeBlock(q.code) : ""}${answerBlocks(q)}</div></details>`;
  }
  document.getElementById("list").innerHTML = html || '<p class="muted">Ничего не найдено.</p>';
}

/* ---------- быстрая проверка знаний ---------- */

const EXAM_LEVEL_WEIGHT = { simple: 0.5, medium: 1, hard: 2 };
const EXAM_SECONDS = 10 * 60;

let quizView = "setup"; // setup | play | result
let quiz = null; // { mode, items: [{id, weight, extra}], idx, grades: {id: 0|0.5|1}, deadline, timedOut }
let quizRevealed = false;
let quizTimer = null;
const quizSettings = { mode: "short", count: 10 };

function stopQuizTimer() {
  if (quizTimer) {
    clearInterval(quizTimer);
    quizTimer = null;
  }
}

function abortQuiz() {
  stopQuizTimer();
  quiz = null;
  quizView = "setup";
  quizRevealed = false;
}

function sameQuestion(a, b) {
  return a.question === b.question && a.code === b.code;
}

// N вопросов, по кругу из разных тем (вопросы-дубликаты не берём)
function pickBalanced(n) {
  const pools = new Map(TOPICS.map((t) => [t.no, shuffle(QUESTIONS.filter((q) => q.topic_no === t.no))]));
  const order = shuffle(TOPICS.map((t) => t.no));
  const chosen = [];
  while (chosen.length < n && [...pools.values()].some((l) => l.length)) {
    for (const no of order) {
      if (chosen.length >= n) break;
      const list = pools.get(no);
      while (list.length) {
        const q = list.pop();
        if (!chosen.some((c) => sameQuestion(c, q))) {
          chosen.push(q);
          break;
        }
      }
    }
  }
  return shuffle(chosen).map((q) => ({ id: q.id, weight: 1, extra: false }));
}

// как в README: 2 простых + 2 средних + 2 сложных + 3 дополнительных = 10 баллов
function pickExam() {
  const used = [];
  const usedTopics = new Set();
  const items = [];
  const take = (level, extra) => {
    const cands = shuffle(
      QUESTIONS.filter((q) => (level ? q.level === level : true) && !used.some((u) => sameQuestion(u, q)))
    );
    const q = cands.find((c) => !usedTopics.has(c.topic_no)) || cands[0];
    used.push(q);
    usedTopics.add(q.topic_no);
    items.push({ id: q.id, weight: extra ? 1 : EXAM_LEVEL_WEIGHT[q.level], extra });
  };
  for (const level of ["simple", "simple", "medium", "medium", "hard", "hard"]) take(level, false);
  for (let i = 0; i < 3; i++) take(null, true);
  return items;
}

function startQuiz() {
  stopQuizTimer();
  const exam = quizSettings.mode === "exam";
  quiz = {
    mode: quizSettings.mode,
    items: exam ? pickExam() : pickBalanced(quizSettings.count),
    idx: 0,
    grades: {},
    deadline: exam ? Date.now() + EXAM_SECONDS * 1000 : 0,
    timedOut: false,
  };
  quizRevealed = false;
  quizView = "play";
  if (exam) quizTimer = setInterval(tickQuizTimer, 500);
  render();
}

function quizRemaining() {
  return Math.max(0, Math.ceil((quiz.deadline - Date.now()) / 1000));
}

function formatTime(sec) {
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function tickQuizTimer() {
  if (!quiz || quizView !== "play") return stopQuizTimer();
  const left = quizRemaining();
  const el = document.getElementById("timer");
  if (el) {
    el.textContent = formatTime(left);
    el.classList.toggle("low", left <= 60);
  }
  if (left <= 0) {
    quiz.timedOut = true;
    finishQuiz();
  }
}

function renderQuiz() {
  if (quizView === "play" && quiz) return renderQuizPlay();
  if (quizView === "result" && quiz) return renderQuizResult();
  quizView = "setup";
  return renderQuizSetup();
}

function renderQuizSetup() {
  const countOpts = [5, 10, 20]
    .map(
      (n) =>
        `<label class="check"><input type="radio" name="count" value="${n}" ${quizSettings.count === n ? "checked" : ""}>
        <span>${n} ${plural(n, "вопрос", "вопроса", "вопросов")}</span></label>`
    )
    .join("");

  $app.innerHTML = `
    <h2>Быстрая проверка знаний</h2>
    <p class="muted">Один проход без повторов: отвечаете про себя, смотрите ответ и честно оцениваете себя.
    В конце — результат и разбор ошибок.</p>
    <form class="card" id="quiz-setup">
      <label class="check">
        <input type="radio" name="mode" value="short" ${quizSettings.mode === "short" ? "checked" : ""}>
        <span><b>Короткий тест</b><br><span class="muted small">Случайные вопросы из разных тем. Каждый вопрос стоит 1 балл.</span></span>
      </label>
      <div class="field-group indent" id="count-box">${countOpts}</div>
      <label class="check">
        <input type="radio" name="mode" value="exam" ${quizSettings.mode === "exam" ? "checked" : ""}>
        <span><b>Как на колоквиуме</b><br><span class="muted small">2 простых (по 0.5 балла) + 2 средних (по 1) + 2 сложных (по 2) + 3 дополнительных (по 1) = 10 баллов. На всё 10 минут.</span></span>
      </label>
      <div class="btn-row"><button class="btn primary grow" type="submit">Начать проверку</button></div>
    </form>
  `;

  const form = document.getElementById("quiz-setup");
  const sync = () => {
    quizSettings.mode = form.elements.mode.value;
    quizSettings.count = Number(form.elements.count.value);
    document.getElementById("count-box").classList.toggle("hidden", quizSettings.mode !== "short");
  };
  form.addEventListener("change", sync);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sync();
    startQuiz();
  });
  sync();
}

function renderQuizPlay() {
  const item = quiz.items[quiz.idx];
  const q = BY_ID.get(item.id);
  const n = quiz.items.length;
  const exam = quiz.mode === "exam";
  const weightLabel = exam
    ? `<span class="badge">${item.extra ? "дополнительный · " : ""}${item.weight} ${plural(item.weight === 1 ? 1 : 2, "балл", "балла", "баллов")}</span>`
    : "";
  const badgeLine = `<div class="badges"><span class="badge">${esc(topicName(q))}</span>${
    exam && !item.extra ? `<span class="badge ${q.level}">${LEVEL_NAMES[q.level]}</span>` : ""
  }${weightLabel}</div>`;

  $app.innerHTML = `
    <div class="progress-line">
      <span>Вопрос <b>${quiz.idx + 1}</b> из ${n}</span>
      ${exam ? `<span>Осталось: <b id="timer" class="timer">${formatTime(quizRemaining())}</b></span>` : ""}
    </div>
    <div class="bar"><span style="width:${(quiz.idx / n) * 100}%"></span></div>

    <div class="card">
      ${badgeLine}
      ${questionBody(q)}
      ${
        quizRevealed
          ? answerBlocks(q) +
            `<p class="muted small" style="margin:14px 0 0">Как вы ответили?</p>
             <div class="btn-row" style="margin-top:6px">
              <button class="btn bad grow" data-grade="0" type="button">Не знаю <kbd>1</kbd></button>
              <button class="btn half grow" data-grade="0.5" type="button">Частично <kbd>2</kbd></button>
              <button class="btn ok grow" data-grade="1" type="button">Знаю <kbd>3</kbd></button>
            </div>`
          : `<div class="btn-row"><button class="btn primary grow" id="q-reveal" type="button">Показать ответ <kbd>Пробел</kbd></button></div>`
      }
    </div>
    <div class="btn-row"><button class="btn ghost" id="q-exit" type="button">Прервать проверку</button></div>
  `;

  if (quizRevealed) {
    document.querySelectorAll("[data-grade]").forEach((b) => {
      b.addEventListener("click", () => gradeQuiz(Number(b.dataset.grade)));
    });
  } else {
    document.getElementById("q-reveal").addEventListener("click", revealQuiz);
  }
  document.getElementById("q-exit").addEventListener("click", () => {
    abortQuiz();
    render();
  });
  window.scrollTo({ top: 0 });
}

function revealQuiz() {
  quizRevealed = true;
  render();
}

function gradeQuiz(grade) {
  const item = quiz.items[quiz.idx];
  quiz.grades[item.id] = grade;
  if (grade < 1) {
    const weak = loadJSON(KEY_WEAK, {});
    weak[item.id] = 1;
    saveJSON(KEY_WEAK, weak);
  }
  quiz.idx += 1;
  quizRevealed = false;
  if (quiz.idx >= quiz.items.length) finishQuiz();
  else render();
}

function finishQuiz() {
  stopQuizTimer();
  quizView = "result";
  render();
}

function fmtScore(x) {
  return String(Math.round(x * 100) / 100).replace(".", ",");
}

function renderQuizResult() {
  const exam = quiz.mode === "exam";
  const max = quiz.items.reduce((s, it) => s + it.weight, 0);
  const earned = quiz.items.reduce((s, it) => s + it.weight * (quiz.grades[it.id] || 0), 0);
  const percent = Math.round((earned / max) * 100);
  const verdict =
    percent >= 85
      ? "Отлично! Материал вы знаете хорошо."
      : percent >= 60
        ? "Неплохо, но есть что подтянуть."
        : "Пока рано идти на колоквиум: стоит позаниматься в режиме заучивания.";

  const mark = (g) => (g === undefined ? "—" : g === 1 ? "✓" : g === 0.5 ? "½" : "✗");
  const cls = (g) => (g === 1 ? "ok" : g === 0.5 ? "half" : "bad");

  const byTopic = TOPICS.map((t) => {
    const its = quiz.items.filter((it) => BY_ID.get(it.id).topic_no === t.no);
    if (!its.length) return "";
    const got = its.reduce((s, it) => s + it.weight * (quiz.grades[it.id] || 0), 0);
    const tot = its.reduce((s, it) => s + it.weight, 0);
    return `<li><span>${esc(t.name)}</span><span class="muted">${fmtScore(got)} из ${fmtScore(tot)}</span></li>`;
  }).join("");

  const rows = quiz.items
    .map((it) => {
      const q = BY_ID.get(it.id);
      const g = quiz.grades[it.id];
      return `<details class="q"><summary><span class="res ${g === undefined ? "" : cls(g)}">${mark(g)}</span>
        ${inlineQuestion(q.question)}</summary>
        <div class="inner">${q.code ? codeBlock(q.code) : ""}${answerBlocks(q)}</div></details>`;
    })
    .join("");

  const missed = quiz.items.filter((it) => (quiz.grades[it.id] || 0) < 1).map((it) => it.id);

  $app.innerHTML = `
    <h2>Результат</h2>
    ${quiz.timedOut ? '<p class="status bad">Время вышло, неотвеченные вопросы считаются как «Не знаю».</p>' : ""}
    <div class="stat-grid">
      <div class="stat"><b>${fmtScore(earned)} из ${fmtScore(max)}</b>${exam ? "баллов" : "баллов (по 1 за вопрос)"}</div>
      <div class="stat"><b>${percent}%</b>правильных ответов</div>
      <div class="stat"><b>${quiz.items.length - missed.length} из ${quiz.items.length}</b>знаю уверенно</div>
    </div>
    <p>${verdict}</p>
    ${
      exam
        ? '<p class="muted small">На настоящем колоквиуме до 3 баллов можно получить на дополнительных вопросах преподавателя, поэтому реальный итог может отличаться.</p>'
        : ""
    }
    <h3>По темам</h3>
    <ul class="list-plain split">${byTopic}</ul>
    <h3>Все вопросы <span class="muted small">(нажмите, чтобы увидеть ответ)</span></h3>
    ${rows}
    <div class="btn-row">
      ${
        missed.length
          ? `<button class="btn primary" id="learn-missed" type="button">Заучить ошибки (${missed.length})</button>`
          : ""
      }
      <button class="btn" id="again" type="button">Пройти ещё раз</button>
      <button class="btn ghost" id="to-setup" type="button">К выбору режима</button>
    </div>
  `;

  const learnMissed = document.getElementById("learn-missed");
  if (learnMissed) {
    learnMissed.addEventListener("click", () => {
      abortQuiz();
      markTab("learn");
      startSession(missed);
    });
  }
  document.getElementById("again").addEventListener("click", startQuiz);
  document.getElementById("to-setup").addEventListener("click", () => {
    abortQuiz();
    render();
  });
}

/* ---------- клавиатура ---------- */

document.addEventListener("keydown", (e) => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (currentTab === "quiz" && quizView === "play" && quiz) {
    if (!quizRevealed && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      revealQuiz();
    } else if (quizRevealed && ["1", "2", "3"].includes(e.key)) {
      e.preventDefault();
      gradeQuiz([0, 0.5, 1][Number(e.key) - 1]);
    }
    return;
  }

  if (currentTab !== "learn" || learnView !== "play" || !session) return;
  if (!revealed && (e.key === " " || e.key === "Enter")) {
    e.preventDefault();
    reveal();
  } else if (revealed && (e.key === "1" || e.key === "ArrowLeft")) {
    e.preventDefault();
    answer(false);
  } else if (revealed && (e.key === "2" || e.key === "ArrowRight")) {
    e.preventDefault();
    answer(true);
  }
});

/* ---------- старт ---------- */

setTab("learn");

</script>
</body>
</html>
